<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>220th Training Board</title>
    <meta name="description" content="UNCLASSIFIED training demo board — 220th Airlift Wing" />
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="home-os.css" />
  </head>
  <body>
    <div class="banner" id="banner">UNCLASSIFIED // TRAINING DEMO // FICTITIOUS DATA</div>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark has-img" id="brandMark">
            <img id="unitLogo" alt="220th Airlift Wing" />
          </span>
          <div>
            <p class="brand-kicker" id="brandKicker">220th Airlift Wing</p>
            <p class="brand-name" id="brandName">Training Board</p>
          </div>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-foot" id="sidebarFoot">Philippine Air Force · 220th Airlift Wing</div>
      </aside>
      <div class="main">
        <header class="top">
          <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">Menu</button>
          <div class="min">
            <h1 id="pageTitle">HOME</h1>
            <p class="clock" id="clock">Live clock starting…</p>
          </div>
          <div class="top-actions">
            <img class="paf-seal" id="pafSeal" alt="Philippine Air Force" />
            <span class="live-pill"><span class="live-dot"></span> LIVE</span>
            <a class="edit-btn" href="#/update">Edit board</a>
          </div>
        </header>
        <main id="app"></main>
        <footer class="focus-bar" id="focusBar">
          <img id="focusMark" alt="FOCUS PAF — Mission, Capability, Values" />
        </footer>
      </div>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <script src="marks.js"></script>
    <script src="app.js"></script>
    <script src="profile.js"></script>
    <script src="home-os.js"></script>
  </body>
</html>
